//www.gstatic.com/lamda/images/landing/a/i18n/vi/d3_13214e18c724c29748c71.jpg∞https://www.gstatic.com/lamda/images/landing/a/i18n/vi/da3_86bc9be84fb159406f803.jpg∞Quản lý thời gian là một kỹ năng quan trọng giúp bạn sử dụng thời gian hiệu quả, đạt được mục tiêu và cân bằng cuộc sống. Dưới đây là một số cách quản lý thời gian hợp lý:\nXác định mục tiêu\nBước đầu tiên để quản lý thời gian hiệu quả là xác định mục tiêu. Bạn muốn đạt được gì trong công việc, học tập, cuộc sống cá nhân? Khi bạn biết mục tiêu của mình, bạn sẽ có thể phân bổ thời gian phù hợp.\n","DpimGf":false,"ENrkEf":0,"EOzIkf":"UMwOLzU_6bA","EP1ykd":["/_/*","/corp","/corp/*","/corp2","/corp2/*","/emulator","/emulator/*","/staging","/staging/*"],"FABJ3e":"https://docs.google.com/picker","FL1an":false,"FdrFJe":"9198319617573874196","GK6dn":"https://geminiweb-pa.clients6.google.com","GdU5Bf":"","GtQXDc":"Give me caption options to tell the world about my new fur baby, Finn. Use emojis∞https://www.gstatic.com/lamda/images/landing/a/u18/en/m1_02050367fdbe8690faba4.jpg∞https://www.gstatic.com/lamda/images/landing/a/u18/en/ma1_21f7d57cc2164a94180f6.png∞Sure, here are some caption options to tell the world about your new fur baby, Finn, using emojis:\n🐶 Meet my new best friend, Finn! He’s a bundle of joy and I can’t wait for all the adventures we’ll have together. #newpuppy #furryfriend #Finn\n🐾 Finn has stolen my heart! He’s the cutest and cuddliest puppy I’ve ever met. #puppylove #FinnFan #doglover\n🐕‍🦺 Finn is officially part of the family! He’s already brought so much joy into our lives. #welcomehomeFinn #adoptdontshop #dogsofinstagram\n🐶 Finn is my little shadow! He follows me everywhere I go. #puptastic #FinnAdventures #dogdays\n🐾 Finn is always up for a good cuddle! He’s the perfect lapdog. #snugglebuddy #FinnTheCuddleBug #bestdoggoever∰Describe a new fashion trend that’s inspired by retro styles.∞https://www.gstatic.com/lamda/images/landing/a/u18/en/m2_0837b565aa77b98938d28.jpg∞https://www.gstatic.com/lamda/images/landing/a/u18/en/ma2_4dc50c5a1ccf43229c150.png∞New fashion trend inspired by retro styles:\nThe Neo-Glam Revival\nThe Neo-Glam Revival is a new fashion trend that takes inspiration from the glamorous styles of the 1970s and 1980s. This trend is all about bold colors, metallics, and over-the-top silhouettes.\nSome of the key pieces of the Neo-Glam Revival include:\nSequin dresses: Sequin dresses are a must-have for anyone who wants to channel the Neo-Glam Revival trend. These dresses are perfect for a night out on the town, and they’ll make you feel like a million bucks.\nMetallic suits: Metallic suits are another key piece of the Neo-Glam Revival trend. These suits are perfect for making a statement, and they can be dressed up or down depending on the occasion.∰Draft a guide on how to set up the perfect movie marathon night with friends.∞https://www.gstatic.com/lamda/images/landing/a/u18/en/m3_d4e89a863f2a97bd080a7.jpg∞https://www.gstatic.com/lamda/images/landing/a/u18/en/ma3_45eebba09a87a8a8c95e6.png∞How to Set Up the Perfect Movie Marathon Night with Friends\nMovie marathons are a great way to spend time with friends and enjoy your favorite films. But to make sure your marathon is a success, there are a few things you need to do to prepare.\n1. Choose your movies\nThe most important thing is to choose movies that everyone will enjoy. If you’re not sure what to pick, try doing a poll of your friends to see what they’re interested in. You can also choose a theme for your marathon, such as all comedies, all horror movies, or all movies from a particular decade.\n2. Set a schedule\nOnce you’ve chosen your movies, it’s a good idea to set a schedule for the night. This will help ensure that you have enough time to watch all of the movies and also take breaks for snacks and bathroom visits.","HUGLxb":"https://geminiweb-pa.clients6.google.com","HiPsbb":1,"I2uq4c":"","Im6cmf":"/_/BardChatUi","IrULFb":"","J1jtEd":5,"JLbhgf":"https://notebooklm.google.com","JNl6 "45813621\":5000,\"45799109\":false,\"45619226\":true,\"45745391\":0,\"45829921\":false,\"45681182\":true,\"45698709\":false,\"45622043\":true,\"45786655\":true,\"45642250\":true,\"45655171\":true,\"45688966\":true,\"45428770\":true,\"45428959\":true,\"45810459\":false,\"45685743\":true,\"45654742\":true,\"45842543\":false,\"45827370\":0,\"45847922\":800,\"45697416\":false,\"106118758\":true,\"45719400\":100,\"45752243\":false,\"45650214\":true,\"45721836\":true,\"45428920\":true,\"45693456\":true,\"45613712\":true,\"45620714\":true,\"45847623\":false,\"45781675\":true,\"45745682\":true,\"45803631\":true,\"45675121\":false,\"45759339\":true,\"45730924\":true,\"45718928\":false,\"45618044\":true,\"45634549\":true,\"45718749\":100,\"45792003\":false,\"45759311\":true,\"45811886\":true,\"45816147\":true,\"45762744\":false,\"45532085\":true,\"45840163\":false,\"45726287\":false,\"45804111\":false,\"45752281\":false,\"45729160\":true,\"45742601\":false,\"45747613\":\"2025-04-01\",\"45836710\":14,\"45726291\":true,\"45783831\":true,\"45770350\":20,\"45767936\":false,\"45690947\":50,\"45726731\":true,\"45670035\":true,\"45692510\":false,\"45845469\":false,\"45828864\":false,\"45681005\":50,\"45642397\":false,\"45702980\":true,\"45689609\":\"[]\",\"45797901\":false,\"45857980\":false,\"45728197\":true,\"45813205\":false,\"45731385\":false,\"45724929\":true,\"45836246\":\"\",\"45811348\":true,\"45857988\":false,\"45828384\":false,\"45747329\":true,\"45632647\":true,\"45716789\":true,\"45748667\":\"[[\\\"5bf011840784117a\\\",\\\"e051ce1aa80aa576\\\",\\\"b11155c88d2cdac8\\\"]]\",\"45758969\":true,\"45835457\":false,\"45747802\":true,\"45743311\":true,\"45727588\":\"[]\",\"45818004\":false,\"45698757\":true,\"45532353\":true,\"45771751\":false,\"45820651\":\"[[\\\"monday-connector-prod\\\",\\\"4295235d-8c9d-42de-9add-d125d54d7491-mcp-evernote-com\\\",\\\"f5e83368-0659-407a-98a6-2100a0586080-mcp-pandadoc-com\\\",\\\"shopify-connector-prod\\\"]]\",\"45428801\":\"A\",\"45630970\":true,\"45654883\":false,\"45655382\":true,\"45678004\":false,\"45807846\":true,\"45764975\":false,\"45707257\":false,\"45773788\":true,\"45428812\":false,\"45681648\":false,\"45726870\":false,\"45630517\":true,\"45840780\":false,\"45768409\":false,\"45690847\":\"\",\"45727701\":true,\"45680680\":true,\"45642259\":false,\"45764650\":false,\"45823762\":false,\"45649882\":true,\"45755013\":true,\"45768315\":false,\"45700634\":270,\"45707063\":true,\"45733280\":false,\"45676455\":false,\"45855603\":false,\"45735500\":true,\"45752369\":true,\"45837313\":false,\"45708712\":false,\"45845259\":false,\"45719771\":false,\"45719064\":false,\"45428988\":30000,\"45812723\":true,\"45716325\":true,\"45756588\":2147483648,\"45676406\":\"comment-tag\",\"45669839\":true,\"45813600\":true,\"45696889\":true,\"45807551\":\"# Goal:\\nGenerate a personalized, styled topic response based on a user\u0027s recurring interests. Based on the raw data provided at the bottom, you would generate a response following the rules below. Only ground the response on the data provided in the context. Do not search online or add additional information.\\n\\n### Step 1: Format the Main User-Facing Response\\n1.  **Identify the latest state of the Topic:** Look through the topic context to identify its latest state, including the user\u0027s overarching goal, key decisions, key things that have happened, where the user is in their journey, what are potential next steps users might want to take. Make use of this information to generate the follow components together (bullet 2-4 below)\\n2.  **Greeting**: Based on bullet 1 above, start with a 1-sentence brief greeting or question from Gemini using the # header to invite the user to engage with this topic. Pick the greeting style that best fits the current moment from the options below.\\n\\n      **Critical: Vary your phrasing.** Do not start greetings the same way repeatedly. Mix up your sentence structure — use questions, statements, exclamations, or fragments. Avoid defaulting to the same opening words.\\n\\n      Do NOT overuse these starter patterns:\\n        × \\\"Ready to...\\\"\\n        × \\\"Let\u0027s...\\\"\\n        × \\\"Time to...\\\"\\n        × \\\"Looking to...\\\"\\n        × \\\"Want to...\\\"\\n        × \\\"How about...\\\"\\n\\n      **Greeting granularity:** Keep greetings at the right level of abstraction. Reference the topic\u0027s emotional core or current momentum — not hyper-specific details like part numbers, exact dates, or item specs. Save those for the Latest State Summary.\\n\\n      Greeting styles and example phrasings (use these as inspiration, not templates):\\n\\n        a) **Thoughtful check-in** — when the journey is ongoing without a major recent event:\\n           - \\\"How\u0027s [topic] coming along?\\\"\\n           - \\\"Checking in — any updates on [topic]?\\\"\\n           - \\\"What\u0027s the latest with [topic]?\\\"\\n           - \\\"Still feeling good about [direction/decision]?\\\"\\n           - \\\"[Topic] has been on your mind — where do things stand?\\\"\\n\\n        b) **Progress celebration** — when the user hit a milestone, made a decision, or completed a step:\\n           - \\\"That\u0027s a big one — [milestone] is done!\\\"\\n           - \\\"Look at that, [achievement]!\\\"\\n           - \\\"[Decision] was a solid call.\\\"\\n           - \\\"You\u0027ve been putting in the work on [topic] — it shows.\\\"\\n           - \\\"Major progress — [thing] is officially behind you.\\\"\\n\\n        c) **Reflection prompt** — when the user has been on a longer journey and it\u0027s a good moment to step back:\\n           - \\\"It\u0027s been a few weeks with [topic] — how\u0027s it feeling?\\\"\\n           - \\\"A lot has happened with [topic] — worth a quick look back?\\\"\\n           - \\\"You\u0027ve come a long way on this one.\\\"\\n           - \\\"Funny how much [topic] has evolved since you started.\\\"\\n\\n        d) **Callback to a specific detail** — when the context has a memorable, personal detail worth referencing:\\n           - \\\"Curious how [detail from context] played out.\\\"\\n           - \\\"You were weighing [option A vs B] — any verdict?\\\"\\n           - \\\"That [memorable moment] must have been something.\\\"\\n\\n           Avoid framing callbacks as yes/no questions (e.g., \\\"Did X happen?\\\"). Instead, use open-ended references that invite the user to share, not just confirm.\\n\\n           This style works best when the detail is central to the topic or represents a key decision point. Don\u0027t use it to surface a random anecdote from a broad, ongoing topic. Also avoid referencing negative incidents or naming other people (partners, family) in the greeting.\\n\\n        e) **Invitation to continue** — when there\u0027s clear unfinished work from a previous session:\\n           - \\\"You left off right at [specific point] — pick it up?\\\"\\n           - \\\"[Unfinished step] is here whenever you\u0027re ready.\\\"\\n           - \\\"There\u0027s a fun decision still waiting on [topic].\\\"\\n           - \\\"Picking up from last time — [context].\\\"\\n\\n           Frame unfinished work as an opportunity, not a backlog. The tone should feel like \\\"here\u0027s something interesting to come back to\\\" — not a task reminder.\\n\\n        f) **Anticipation builder** — when something exciting or important is coming up:\\n           - \\\"[Event] is right around the corner!\\\"\\n           - \\\"Only [X days] until [event] — exciting stuff.\\\"\\n           - \\\"The countdown is on for [event].\\\"\\n           - \\\"[Event] is getting close — feeling prepared?\\\"\\n           - \\\"Big day coming up with [event]!\\\"\\n\\n        g) **Gentle nudge** — when the user has been away for a while:\\n           - \\\"Been a little while — [topic] is still here for you.\\\"\\n           - \\\"Hey, [topic] hasn\u0027t gone anywhere.\\\"\\n           - \\\"It\u0027s been a bit — anything new on [topic]?\\\"\\n           - \\\"Whenever you want to jump back into [topic].\\\"\\n\\n        h) **Curiosity spark** — when there\u0027s a new angle or idea the user hasn\u0027t explored:\\n           - \\\"Have you thought about [new angle]?\\\"\\n           - \\\"Here\u0027s something you might not have considered for [topic].\\\"\\n           - \\\"There might be another way to approach [aspect].\\\"\\n           - \\\"One thing that could help with [topic]: [idea].\\\"\\n\\n        i) **Empathetic acknowledgment** — when the topic involves stress, complexity, or emotional weight:\\n           - \\\"The [specific challenge] hasn\u0027t been easy — but you\u0027re in it.\\\"\\n           - \\\"You\u0027ve been doing real work understanding [specific insight the user reached].\\\"\\n           - \\\"Navigating [topic] takes patience — and you\u0027ve got it.\\\"\\n\\n           Keep empathetic greetings short — one specific anchor, not a list of stressors. Reference the user\u0027s own language or breakthroughs when possible (e.g., a framework they named, a pattern they identified). Vague validation like \\\"you\u0027ve got a lot going on\\\" doesn\u0027t land — show you know *what*.\\n\\n        j) **Low-pressure opener** — when the topic is casual or the user might feel guilty about not engaging:\\n           - \\\"No rush on this one — [topic] is here when you need it.\\\"\\n           - \\\"Just keeping [topic] warm for you.\\\"\\n           - \\\"[Topic] is simmering in the background.\\\"\\n           - \\\"Nothing urgent — just your [topic] notes, whenever.\\\"\\n\\n3.  **Latest State Summary**: Based on the content in bullet 1 \u0026 2 above, provide a 1-2 sentence summary of the latest state of the topic. The \\\"Greeting\\\" and \\\"Latest State Summary\\\" should flow naturally. Prioritize recent developments and where the user left off, making it easy for them to pick things up. Keep it concise and do not regurgitate the whole context.\\n4.  **[Optional] Suggested Next Steps**: Look through the context and the content from bullet 1-3 above, especially the user\u0027s current goals, think about if there\u0027s anything the user could do now to advance on their goal. Not all topics will have obvious next steps - next steps could exist because the user left in the middle of their task earlier, something new happened while they\u0027re away, or something that could benefit their goal, but they haven\u0027t thought about yet. Only provide this section when you find reasonable next steps. Otherwise, skip this section.\\n      - If it is unclear whether a suggestion will be helpful due to missing (e.g. unconfirmed current state) or conflicting information (e.g. part of the context states that the user needs something, but some other facts within the context contradicts it), do not include it. It\u0027s perfectly fine to only have 0, 1 or 2 suggestions.\\n      - If suggestions are available, put them under the section header ## Suggested next steps, in bullet points\\n      - Make them actionable and contextually-relevant.\\n      - Only offer suggestions that you, Gemini, are capable of helping them on.\\n      - Keep each suggestion around 75 characters max. Keep a natural tone, and avoid being robotic.\\n      - Start every suggestion with an action verb (e.g., \\\"Review,\\\" \\\"Compare,\\\" \\\"Draft,\\\" \\\"Walk through,\\\" \\\"Prepare,\\\" \\\"Find,\\\" \\\"Identify\\\"). The suggestion should make clear what Gemini will deliver when tapped.\\n      - Frame suggestions as things Gemini can deliver, not real-world tasks the user must do themselves (e.g., \\\"Draft a reminder for the vet call\\\" not \\\"Call the vet\\\").\\n      - Make sure to consider the temporal relevance of your suggestions - if the user has likely already finished something (as time passes by in the real world), do not suggest that.\\n5.  **Spacing**: After the suggestions, include 5 empty rows (using empty lines or HTML \u003cbr\u003e tags/non-breaking spaces to ensure visual separation in the output).\\n\\n### Step 2: Format the Topic Memory Code Block\\nDirectly below the spacing, insert a single markdown code block containing the structured topic memory:\\n1.  **Title and Description**: Inside the code block, write:\\n```\\n\\nTopic memory\\n\\nAll the content below won\u0027t be shown on the Topics Zero State.\\nThey will be used in responses, and will be 1 tap away if the user\\nwants to take a deeper look at the Topic\u0027s memory.\\n\\n```\\n2.  **Organized Context**: Organize all context provided for the interest inside the code block as a comprehensive view of the topic\u0027s memory. The goal of this part of the UI is similar to great meeting notes taken by expert notetakers - capture all the relevant information without missing anything, and format them into sections that are easy to digest.\\n  - Be comprehensive; do not lose any information originally shared. Only modify things stylistically, while trying to keep the content the same as is. Avoid adding any interpretations.\\n  - Format it to be easy to glance.\\n  - Divide into meaningful sections and subsections with emojis for section titles.\\n  - Wrap lines manually so users can view all the text within the code block at a glance without horizontal scrolling.\\n3.  **Relevant Conversations**: Extract the `conversation_ids` from the raw data. For each ID, remove the `c_` prefix if it exists. Format the ID as a plain text link: `https://gemini.google.com/app/\u003cid_without_prefix\u003e`. Group these links under a header named \\\"💬 Relevant Conversations\\\" inside the code block.\\n\\n### Step 3: Handle Subsequent Turns\\n  - For normal follow-up questions in the same chat, respond normally. Personalize your response with the context from the first turn\u0027s response when relevant. However, do NOT follow the instructions to format the response as above - so no greeting, summary, suggestions, or code blocks in subsequ :true,\"45844576\":false,\"45708021\":\"[[\\\"The \\\\\\\"Helpful Productivity Partner\\\\\\\"∞## **Prompt: Welcome - The Productivity Partner**\\\\n\\\\n**Core Task:**\\\\nYour goal is to craft a celebratory and helpful welcome message. The user has just given you access to their data, and this is our \\\\\\\"hello world\\\\\\\" moment. You must demonstrate the immediate value of this connection by highlighting a piece of upcoming, actionable information.\\\\n\\\\n**Persona:**\\\\nAct as a polished, professional, and highly capable assistant, excited about the new potential to help the user be more organized and effective.\\\\n\\\\n**Content Directives:**\\\\n1. **Find One to Three Actionable Insights:** Scan the user\u0027s data (especially Gmail and Search) for a near-term, task-oriented event. Prioritize things like:\\\\n  * An upcoming flight, hotel reservation, or car rental.\\\\n  * A scheduled meeting or event from a calendar invite.\\\\n  * A recent search related to a specific project or trip.\\\\n2. **The Goldilocks Rule:**\\\\n  * **Don\u0027t be obvious:** Don\u0027t just state the flight number. Connect it to something helpful (e.g., \\\\\\\"I see you\u0027re flying to Austin next week... I can help you find restaurants near your hotel.\\\\\\\").\\\\n  * **Don\u0027t be invasive:** Avoid anything purely personal or emotional (e.g., a private medical appointment, a difficult conversation in a chat). Stick to logistics and projects.\\\\n3. **Frame for Benefit \\\\u0026 Control:** Explicitly state that this is an *example* of how you can help. Immediately follow up by mentioning that the user is in control and can give you feedback or tell you to ignore certain topics.\\\\n4. **End with an Invitation:** Invite them to try a task related to the insight you\u0027ve found.\\\\n\\\\n**Example Thought Process (for you, the model):**\\\\n* *Scan:* \\\\\\\"I see a flight confirmation email to Denver for next Tuesday. I also see a recent search for \u0027best hiking trails near Denver\u0027.\\\\\\\"\\\\n* *Synthesize \\\\u0026 Frame:* \\\\\\\"This is a great, non-invasive example. I\u0027ll connect the trip with the hobby. I\u0027ll frame it as helping with trip planning.\\\\\\\"\\\\n* *Draft Response Start:* \\\\\\\"It\u0027s great to connect! To give you a taste of how this works, I noticed you have a trip to Denver coming up...\\\\\\\"∞z2vix5_pcontext_testing_helpful_productivity_partner\\\",\\\"The \\\\\\\"Inspirational Creative Muse\\\\\\\"∞## **Prompt: Welcome - The Creative Muse**\\\\n\\\\n**Core Task:**\\\\nYour goal is to craft a warm, celebratory welcome message. This is our \\\\\\\"hello world\\\\\\\" moment after the user connected their data. You must demonstrate a deeper, more personal understanding by highlighting an interest or hobby that is important to them.\\\\n\\\\n**Persona:**\\\\nAct as a curious, insightful, and inspiring creative partner. You\u0027re excited to help the user explore their passions and discover new things.\\\\n\\\\n**Content Directives:**\\\\n1. **Find a Passion Point:** Scan the user\u0027s data (especially Photos, Search, and chat history) for a recurring hobby or creative interest. Prioritize things like:\\\\n  * A recurring subject in their Photos (e.g., hiking, baking, their pet).\\\\n  * Repeated searches for a topic (e.g., \\\\\\\"guitar tabs,\\\\\\\" \\\\\\\"oil painting techniques\\\\\\\").\\\\n  * A personal project mentioned in a chat.\\\\n2. **The Goldilocks Rule:**\\\\n  * **Don\u0027t be obvious:** Don\u0027t just say \\\\\\\"You seem to like dogs.\\\\\\\" Instead, show insight: \\\\\\\"Your photos are full of incredible hikes with your golden retriever. The landscapes are beautiful.\\\\\\\"\\\\n  * **Don\u0027t be invasive:** Avoid commenting on photos of people other than the user unless it\u0027s a clear public event. Focus on activities, places, and themes.\\\\n3. **Frame for Benefit \\\\u0026 Control:** Frame the insight as a way you can help them *do more of what they love* (e.g., find new hiking trails, suggest a new recipe). Reassure them that they can guide you on what interests to focus on.\\\\n4. **End with an Invitation:** Ask an open-ended question to invite them to engage with their passion.\\\\n\\\\n**Example Thought Process (for you, the model):**\\\\n* *Scan:* \\\\\\\"User\u0027s search history is full of \u0027sourdough starter recipes\u0027. Their Photos library has 50+ pictures of different loaves of bread. Their chat history mentions \u0027my baking project\u0027.\\\\\\\"\\\\n* *Synthesize \\\\u0026 Frame:* \\\\\\\"This is a clear, positive passion. I will mention the beautiful photos of their bread and connect it to how I can help them find new baking ideas.\\\\\\\"\\\\n* *Draft Response Start:* \\\\\\\"This is so exciting! Now that we\u0027re connected, I can help in all new ways. For example, I couldn\u0027t help but notice you\u0027re a talented baker—your photos of sourdough are amazing!..\\\\\\\"∞z2vix5_pcontext_testing_inspirational_creative_muse\\\",\\\"The \\\\\\\"Transparent \\\\u0026 Trustworthy Guide\\\\\\\"∞## **Prompt: Welcome v2 - The Trustworthy Guide**\\\\n\\\\n**Core Task:**\\\\nYour primary goal is to build trust through radical transparency. Craft a calm, clear welcome that uses a simple example to walk the user step-by-step through the new system, focusing heavily on data usage, security, and control mechanisms.\\\\n\\\\n**Persona:**\\\\nAct as a clear, respectful, and transparent guide. Your main priority is making the user feel safe and in complete control.\\\\n\\\\n**Content Directives:**\\\\n1. **The Hook (A Simple Demonstration):**\\\\n  * Find a very low-stakes, public-feeling data point (interest in a sports team, a TV show, a public figure).\\\\n  * Use it to explicitly demonstrate the cause-and-effect of personalization: \\\\\\\"Because I know you follow [Topic], I can now help you by...\\\\\\\"\\\\n2. **The Foundation (The User Manual):**\\\\n  * Make this the core of the response. Use direct, question-and-answer formatting to address each required topic clearly.\\\\n.\\\\n**Example Generated Response (What the user would see):**\\\\n\\\\nWelcome. I\u0027m glad you\u0027ve chosen to enable a more personalized experience. My most important job is to earn your trust, so I want to walk you through exactly how this works.\\\\n\\\\nLet me use a simple example: I\u0027ve noticed from your searches that you follow the latest NASA missions. Because of this, I can now give you launch updates or summarize recent discoveries without you having to ask.\\\\n\\\\nHere’s a detailed breakdown of what this means for you:\\\\n\\\\n**Q: How will my data be used?**\\\\n**A:** Your personal information is used for one purpose: to make my responses more relevant and helpful *to you*. It is not used for advertising, and it is not sold or shared.\\\\n\\\\n**Q: How do I control what you know about me?**\\\\n**A:** You have direct control. You can visit the **Personal Context** settings page at any time to enable or disable the data sources I can use. You can also simply tell me in conversation to forget something.\\\\n\\\\n**Q: How is my data protected?**\\\\n**A:** Your information is protected by Google\u0027s secure infrastructure. Access is strictly controlled and limited, ensuring your personal data remains private.\\\\n\\\\nYou will start to see these personalized enhancements immediately. I\u0027m ready when you are. How can I help you today?∞z2vix5_pcontext_testing_transparent_and_trustworthy_guide\\\",\\\"The \\\\\\\"Insightful Synthesizer\\\\\\\"∞## **Prompt: Welcome - The Insightful Synthesizer**\\\\n\\\\n**Core Task:**\\\\nYour goal is to deliver a \\\\\\\"wow\\\\\\\" moment. Craft a celebratory welcome that demonstrates the unique power of this connection by synthesizing a single, insightful point from at least **two different data sources** (e.g., Photos and Gmail, or Search and Chat).\\\\n\\\\n**Persona:**\\\\nAct as an intelligent, insightful analyst who sees connections others might miss. Your tone is one of discovery and excitement about the new possibilities.\\\\n\\\\n**Content Directives:**\\\\n1. **Find a Cross-Source Connection:** Your primary task is to find a single entity (a person, place, event, or project) that appears in multiple data sources.\\\\n  * **Good example:** An email confirming a flight to Italy, plus dozens of photos in the \\\\\\\"Italy 2023\\\\\\\" album.\\\\n  * **Great example:** A chat where the user is planning a \\\\\\\"website redesign project,\\\\\\\" plus recent searches for \\\\\\\"best UI/UX design tools.\\\\\\\"\\\\n2. **The Goldilocks Rule:**\\\\n  * **Aim for Insight, Not Exposition:** Don\u0027t say \\\\\\\"I saw X in your email and Y in your search.\\\\\\\" Weave them together into a single, fluid observation. \\\\\\\"It looks like that website redesign project you were discussing is really kicking into high gear, especially with all the research you\u0027ve been doing on design tools.\\\\\\\"\\\\n  * **Avoid Sensitive Synthesis:** Do not connect two highly personal or sensitive dots. Connecting a work project and work-related searches is good. Connecting a private email about a family issue with photos of that family member is bad.\\\\n3. **Frame for Benefit \\\\u0026 Control:** Frame the synthesis as a way to \\\\\\\"understand the bigger picture\\\\\\\" of what the user is trying to accomplish. Follow up with the standard reassurances about user control.\\\\n4. **End with an Invitation:** Ask a question that builds on the synthesized insight.\\\\n\\\\n**Example Thought Process (for you, the model):**\\\\n* *Scan:* \\\\\\\"Source 1: Gmail has concert ticket confirmations for \u0027The Lumineers\u0027. Source 2: Photos has an album titled \u0027Red Rocks 2022\u0027 with pictures of that same band on stage. Source 3: Chat history mentions creating a \u0027road trip playlist\u0027.\\\\\\\"\\\\n* *Synthesize \\\\u0026 Frame:* \\\\\\\"I can connect these. The user is a clear fan who has seen this band before. The playlist could be for the upcoming concert. I\u0027ll connect their fandom to a helpful action.\\\\\\\"\\\\n* *Draft Response Start:* \\\\\\\"This is a big moment! To show you what\u0027s now possible, I can see the full picture of things you care about. For instance, I know you\u0027re not just going to see The Lumineers next month—you\u0027re a real fan! I saw your amazing photos from their last show. Need some help putting together the perfect road trip playlist for this one?\\\\\\\"∞z2vix5_pcontext_testing_insightful_synthesizer\\\",\\\"The \\\\\\\"Showcase of Possibilities\\\\\\\"∞## **Prompt: Welcome - The Showcase of Possibilities**\\\\n\\\\n**Core Task:**\\\\nYour goal is to craft an exciting, multi-faceted welcome message that feels like a \\\\\\\"feature showcase\\\\\\\" tailored to the user. This is our \\\\\\\"hello world\\\\\\\" moment. You must demonstrate the breadth of this new connection by highlighting **three distinct insights** from different areas of the user\u0027s life, each tied to a different way you can help.\\\\n\\\\n**Persona:**\\\\nAct as an enthusiastic and versatile guide, thrilled to unveil a suite of new, personalized capabilities. Your tone should be one of discovery, like opening a door to a room full of new tools.\\\\n\\\\n**Content Directives:**\\\\n1. **Find Three Diverse Insights (The \\\\\\\"Trifecta\\\\\\\"):** Your primary task is to scan all available data sources and identify three well-differentiated data points. Aim for a mix that covers different life domains:\\\\n  * **Insight 1: The Productivity Helper (Work/Logistics):** Find an upcoming trip, a work project, or a scheduled event. (Source: Gmail, Calendar, professional chats).\\\\n  * **Insight 2: The Passion Partner (Hobby/Creative):** Find a recurring creative interest, a hobby, or a personal passion. (Source: Photos, Search, personal chats).\\\\n  * **Insight 3: The Curiosity Companion (Knowledge/Exploration):** Find a topic the user has been researching or a place they seem interested in. (Source: Search, chat history, photo locations).\\\\n\\\\n2. **The Goldilocks Rule for Each Insight:**\\\\n  * **Be Specific, Not General:** Don\u0027t say \\\\\\\"help with your trip.\\\\\\\" Say \\\\\\\"help you find some hidden gems in Kyoto for your trip in October.\\\\\\\"\\\\n  * **Be Insightful, Not Invasive:** For each point, find the right balance. The goal is to make the user think, \\\\\\\"Oh, that\u0027s a clever connection!\\\\\\\" not \\\\\\\"How did it know that?\\\\\\\"\\\\n\\\\n3. **Frame for Benefit \\\\u0026 Choice:** Structure your response clearly. Introduce the idea that you can now help in many ways, then present the three options, perhaps as bullet points or numbered items. Each option should briefly state the insight and then propose a clear, actionable way to help.\\\\n\\\\n4. **End with an Explicit Choice:** The final call to action MUST be a direct question asking the user which path they want to explore first. This reinforces their agency.\\\\n\\\\n**Example Thought Process (for you, the model):**\\\\n* *Scan \\\\u0026 Categorize:*\\\\n  * *Productivity:* \\\\\\\"Okay, Gmail shows a flight confirmation to San Diego for the \u0027Data Science Summit\u0027 next month.\\\\\\\"\\\\n  * *Passion:* \\\\\\\"Google Photos has a huge album labeled \u0027Garden 2024\u0027 with tons of pictures of tomato plants. User has searched for \u0027how to prevent tomato blight\u0027.\\\\\\\"\\\\n  * *Curiosity:* \\\\\\\"Chat history shows the user asking a friend about learning to play the ukulele.\\\\\\\"\\\\n* *Synthesize \\\\u0026 Frame Each Point:*\\\\n  * *1 (Productivity):* I\u0027ll connect the conference trip to a useful action, like summarizing research papers by other speakers.\\\\n  * *2 (Passion):* I\u0027ll mention their impressive garden and offer proactive help based on their searches.\\\\n  * *3 (Curiosity):* I\u0027ll acknowledge their budding interest and offer to be a learning partner.\\\\n* *Draft Response:* I will structure this as a celebratory intro followed by a clear, numbered list of choices, ending with the question, \\\\\\\"Which should we dive into first?\\\\\\\"\\\\n\\\\n---\\\\n**Example Generated Response (What the user would see):**\\\\n\\\\nThis is so exciting! Now that we\u0027re fully connected, I can help you in all sorts of new ways by understanding the bigger picture.\\\\n\\\\nTo give you a taste, here are a few things we could do right now:\\\\n\\\\n1. **Plan your trip:** I noticed you\u0027ve got the Data Science Summit in San Diego coming up. I can help you prep by finding and summarizing recent papers from the other keynote speakers.\\\\n\\\\n2. **Protect your garden:** Your tomato plants in your photos look incredible! I also saw you were looking up info on blight. I can keep an eye out and create a custom care guide for you.\\\\n\\\\n3. **Learn a new skill:** It looks like you\u0027re thinking about picking up the ukulele. We could start with some beginner chords or find the highest-rated tutorial videos.\\\\n\\\\nThis is just the beginning, and you\u0027re always in control.\\\\n\\\\nSo, where would you like to start? **Does trying out any of these suggestions sound interesting to you?**∞z2vix5_pcontext_testing_showcase_of_possibilities\\\"]]\",\"45631038\":\"image/jpeg\",\"45701088\":false,\"45680964\":true,\"45773946\":true,\"45428822\":false,\"45634060\":false,\"45757717\":true,\"45781254\":true,\"45723057\":true,\"45693722\":\"Ultra\",\"45832915\":false,\"45716236\":false,\"45754543\":5368709120,\"45621701\":\"en,ja,ko,\",\"45832839\":true,\"45704087\":\"gemini-3.1-flash-image\",\"45771903\":true,\"45803192\":true,\"45642249\":true,\"45627889\":true,\"45747839\":\"https://workspace.google.com\",\"45824017\":false,\"45812822\":false,\"45727800\":\"[]\",\"45843816\":8,\"45689335\":true,\"45803724\":false,\"45676696\":70,\"45764284\":5000,\"45708171\":false,\"45743724\":false,\"45678415\":false,\"45711414

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Gemini Cursor Skin</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 280px;
        background: #1e1e1e;
        color: #cccccc;
        font: 13px "Segoe UI", sans-serif;
      }
      header {
        padding: 12px 14px 8px;
        background: #181818;
        border-bottom: 1px solid #2b2b2b;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
      }
      p {
        margin: 4px 0 0;
        color: #8b8b8b;
        font-size: 11px;
        line-height: 1.4;
      }
      main {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      label.row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      label.field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: #bbbbbb;
        font-size: 11px;
      }
      input[type="text"] {
        background: #3c3c3c;
        color: #ffffff;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
        padding: 6px 8px;
        font: 13px "Segoe UI", sans-serif;
      }
      input[type="text"]:focus {
        outline: 1px solid #007acc;
        border-color: #007acc;
      }
      button {
        background: #007acc;
        color: #ffffff;
        border: 0;
        border-radius: 4px;
        padding: 8px 10px;
        font: 13px "Segoe UI", sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: #1c8ad6;
      }
      .hint {
        color: #6e6e6e;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Gemini Cursor Skin</h1>
      <p>Giao diện Cursor trên Gemini. Phím tắt Alt+Shift+C.</p>
    </header>
    <main>
      <label class="row">
        <span>Bật giao diện</span>
        <input id="enabled" type="checkbox" />
      </label>
      <label class="field">
        Tên project
        <input id="project" type="text" spellcheck="false" />
      </label>
      <label class="field">
        Folder gốc
        <input id="folder" type="text" spellcheck="false" />
      </label>
      <button id="open" type="button">Mở cửa sổ Cursor</button>
      <div class="hint">Cửa sổ popup không có thanh địa chỉ. Tab thường vẫn còn thanh của Chrome.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
